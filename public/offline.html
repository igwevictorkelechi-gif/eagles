<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — SAS</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-4 text-center">
    <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-600 text-2xl font-bold text-white">S</div>
    <h1 class="mt-4 text-xl font-bold text-slate-900">You're offline</h1>
    <p class="mt-2 text-sm text-slate-500">SAS needs a connection to load this page. Check your internet and try again.</p>
    <button onclick="location.reload()" class="mt-6 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Retry</button>
  </div>
</body>
</html>
