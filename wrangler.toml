name = "sas-school-admin"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 database binding.
# Create the DB with: wrangler d1 create sas_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "sas_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "schema/migrations"

[vars]
# JWT signing secret. For production set this as a Pages secret instead:
#   wrangler pages secret put JWT_SECRET
JWT_SECRET = "dev-only-change-me-in-production"
